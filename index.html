<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ORNITHEA · Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  body{ background: var(--espresso); color: var(--paper); display:flex; align-items:center; justify-content:center; min-height: 100svh; }
  .coming{ text-align:center; }
  .coming__brand{ display:flex; align-items:center; justify-content:center; gap:14px; font-family:var(--serif); font-size:20px; letter-spacing:.2em; margin-bottom: 60px; color: color-mix(in srgb,var(--paper) 70%, transparent); }
  .coming__brand img{ height:28px; }
  .coming h1{ font-family:var(--serif); font-weight:400; font-size: clamp(52px, 9vw, 110px); line-height:0.96; letter-spacing:-0.02em; }
  .coming h1 em{ font-style:italic; }
  .coming p{ margin-top: 28px; font-family:var(--sans); font-weight:300; font-size: clamp(15px, 1.8vw, 19px); letter-spacing:.06em; color: color-mix(in srgb,var(--paper) 60%, transparent); }
</style>
</head>
<body>
  <div class="coming">
    <div class="coming__brand">
      <img src="assets/bird-cream.png" alt="" />
      <span>ORNITHEA</span>
    </div>
    <h1>Coming <em>Soon.</em></h1>
    <p>Something exciting is in the works.</p>
  </div>
</body>
</html>
